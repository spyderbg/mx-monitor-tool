# Generated by npm run docker:config. Do not edit identity/port literals here.
services:
  app:
    container_name: mx-monitor-tool-app
    image: mx-monitor-tool
    restart: unless-stopped
    build:
      context: ..
      dockerfile: docker/app.Dockerfile
      args:
        BACKEND_PORT: "3490"
    ports:
      - "127.0.0.1:${APP_PORT:-3490}:3490"
    environment:
      PORT: "3490"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:' + process.env.PORT + '/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
